services:
  - type: web
    name: forsaken-bot-manager
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: WEB_ORIGIN
        value: https://forsaken-website.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        value: https://forsaken-bot-manager-b9vd.onrender.com/auth/discord/callback
      - key: OWNER_DISCORD_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
