@keyframes slowZoom{from{transform:scale(1.035)}to{transform:scale(1.13)}}
.shade{position:fixed;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(0,0,0,.78),rgba(10,0,0,.28) 55%,rgba(0,0,0,.66)),linear-gradient(0deg,rgba(0,0,0,.76),transparent 50%,rgba(0,0,0,.35))}
.vignette{position:fixed;inset:0;z-index:-1;box-shadow:inset 0 0 180px 45px #000;pointer-events:none}
.grain{position:fixed;inset:-50%;z-index:4;pointer-events:none;opacity:.055;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");animation:grain .22s steps(2) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(-2%,-1%)}}
#embers{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.ember{position:absolute;bottom:-15px;border-radius:50%;background:#ff3a20;box-shadow:0 0 12px 3px #f20;animation:rise linear infinite}
@keyframes rise{0%{transform:translate3d(0,0,0) scale(.6);opacity:0}12%{opacity:.9}85%{opacity:.7}100%{transform:translate3d(var(--drift),-110vh,0) scale(1.3);opacity:0}}
.topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:clamp(18px,3vw,34px) clamp(20px,5vw,70px);font:10px/1.4 Arial,sans-serif;letter-spacing:3px;color:#e7b6af}
.brandmark{display:flex;align-items:center;gap:11px}
.branddot{width:7px;height:7px;border-radius:50%;background:#ff3929;box-shadow:0 0 14px #ff2415}
.status{display:flex;align-items:center;gap:9px;color:#c58b83}
main{position:relative;z-index:3;min-height:100svh;width:100%;display:grid;place-items:center;padding:100px 22px 82px}
.content{width:min(100%,900px);text-align:center;animation:arrive 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes arrive{from{opacity:0;transform:translateY(24px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.eyebrow{font:11px Arial,sans-serif;letter-spacing:clamp(4px,1vw,8px);text-transform:uppercase;color:#f0a69d;margin-bottom:20px}
h1{font-size:clamp(64px,14vw,150px);line-height:.88;letter-spacing:clamp(3px,1vw,12px);margin:0;color:#f32c20;text-shadow:0 2px 0 #5b0804,0 0 12px #f20,0 0 42px #b10b04,0 0 90px #780600;animation:titlePulse 3.4s ease-in-out infinite alternate}
@keyframes titlePulse{to{text-shadow:0 2px 0 #5b0804,0 0 20px #ff321f,0 0 62px #d10d05,0 0 115px #850800}}
.rule{width:min(230px,45vw);height:1px;margin:30px auto 24px;background:linear-gradient(90deg,transparent,#ff4a38,transparent);box-shadow:0 0 12px #d21a10}
.tagline{font:clamp(11px,1.5vw,14px) Arial,sans-serif;letter-spacing:clamp(3px,.7vw,6px);color:#f3d0ca;text-transform:uppercase;margin:0 0 17px}
.prompt{font:14px Arial,sans-serif;color:#d4aaa4;margin:0 0 30px}
.actions{width:min(100%,340px);margin:0 auto;display:grid;gap:12px}
button{position:relative;width:100%;min-height:54px;padding:15px 20px;border:1px solid rgba(255,75,58,.8);background:linear-gradient(100deg,rgba(73,4,2,.92),rgba(157,16,9,.88),rgba(65,3,2,.92));color:#fff;font:12px Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;cursor:pointer;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s,background .25s}
button:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.19) 50%,transparent 70%);transform:translateX(-130%);transition:transform .7s}
button:hover{transform:translateY(-3px);border-color:#ffb0a6;box-shadow:0 0 18px #f20,0 0 42px #8c0a04;background:linear-gradient(100deg,#790900,#d21b10,#790900)}
button:hover:before{transform:translateX(130%)}
button:active{transform:scale(.985)}
button:focus-visible{outline:2px solid white;outline-offset:4px}
.secondary{background:rgba(10,0,0,.42);border-color:rgba(232,120,106,.45);color:#f1c7c1}
.secondary:hover{background:rgba(95,7,3,.72)}
.hidden{display:none!important}
.screen{animation:screenIn .65s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(18px);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
.site-list{margin:8px auto 0;width:min(100%,480px);gap:16px}
.site-list button{display:flex;align-items:center;justify-content:space-between;text-align:left;min-height:78px;padding:24px 30px;font-size:16px;letter-spacing:5px}
.site-list .arrow{font-size:25px}
.site-list .maintenance{
  cursor:not-allowed;opacity:.68;
  background:linear-gradient(100deg,rgba(35,20,19,.92),rgba(65,34,31,.88),rgba(30,16,15,.92));
  border-color:rgba(177,115,105,.35);color:#c6aaa5;
  box-shadow:none;transform:none;
}
.site-list .maintenance:before{display:none}
.site-list .maintenance small{
  display:block;margin-top:8px;font:10px Arial,sans-serif;
  letter-spacing:2px;color:#d28a7f;
}
.status-tag{
  font:9px Arial,sans-serif;letter-spacing:1.5px;
  color:#e2a49b;border:1px solid #87534c;padding:7px 9px;
}

.arrow{font-size:18px;color:#ff9b8e}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px clamp(20px,5vw,70px);font:9px Arial,sans-serif;letter-spacing:2.5px;color:#bd827a}
.bottom span:last-child{color:#e08a7e}
@media(max-width:600px){.topbar{padding:18px 18px}.topbar .right-note{display:none}main{padding:90px 20px 75px}.eyebrow{margin-bottom:16px}.rule{margin:23px auto 19px}.prompt{margin-bottom:23px}.site-list{gap:13px}.site-list button{min-height:70px;padding:20px 22px;font-size:15px;letter-spacing:4px}.site-list .arrow{font-size:23px}.bottom{padding:16px 18px;font-size:8px;letter-spacing:1.5px}}
@media(max-height:650px){main{padding-top:75px;padding-bottom:65px}.eyebrow{margin-bottom:12px}h1{font-size:clamp(55px,12vh,100px)}.rule{margin:18px auto}.prompt{margin-bottom:16px}button{min-height:46px;padding:12px}.bottom{padding-top:10px;padding-bottom:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="backdrop"></div><div class="shade"></div><div class="vignette"></div>
<div id="embers" aria-hidden="true"></div><div class="grain"></div>
<header class="topbar">
 <div class="brandmark"><i class="branddot"></i><span>FORSAKEN EXPERIENCE</span></div>
 <div class="right-note">ENTER THE INFERNO</div>
 <div class="status"><i class="branddot"></i><span>PORTAL ONLINE</span></div>
</header>
<main>
 <div class="content">
  <div class="eyebrow">A world beyond the ordinary</div>
  <h1>FORSAKEN</h1>
  <div class="rule"></div>
  <div class="tagline">Thank you for using Forsaken</div>
  <section id="welcome" class="screen">
   <p class="prompt">Would you like to continue?</p>
   <div class="actions"><button id="continueBtn">Continue <span class="arrow">→</span></button></div>
  </section>
  <section id="sites" class="hidden">
   <p class="prompt">Choose your destination</p>
   <div class="actions site-list">
    <button data-url="https://app.beamse.pro/gen/Forsaken"><span>Site One</span><span class="arrow">↗</span></button>
    <button class="maintenance" type="button" disabled aria-label="Site Two is under maintenance"><span>Site Two <small>UNDER MAINTENANCE</small></span><span class="status-tag">MAINTENANCE</span></button>
    <button data-url="https://www.logged.tg/auth/forsaken"><span>Site Three</span><span class="arrow">↗</span></button>
    <button id="backBtn" class="secondary"><span>← Back</span></button>
   </div>
  </section>
 </div>
</main>
<footer class="bottom"><span>© FORSAKEN</span><span>✦ THE RED INFERNO ✦</span></footer>
<script>
const welcome=document.getElementById('welcome'),sites=document.getElementById('sites');
document.getElementById('continueBtn').addEventListener('click',()=>{welcome.classList.add('hidden');sites.classList.remove('hidden');sites.classList.add('screen')});
document.getElementById('backBtn').addEventListener('click',()=>{sites.classList.add('hidden');welcome.classList.remove('hidden')});
document.querySelectorAll('[data-url]').forEach(b=>b.addEventListener('click',()=>window.open(b.dataset.url,'_blank','noopener,noreferrer')));
const holder=document.getElementById('embers');
for(let i=0;i<48;i++){const e=document.createElement('i');e.className='ember';const s=2+Math.random()*4;e.style.left=Math.random()*100+'%';e.style.width=s+'px';e.style.height=s+'px';e.style.animationDuration=5+Math.random()*10+'s';e.style.animationDelay=-Math.random()*14+'s';e.style.setProperty('--drift',(Math.random()*150-75)+'px');holder.appendChild(e)}
</script>
</body>
</html>
