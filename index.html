<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080202">
<title>FORSAKEN — Official Portal</title>
<style>
:root{color-scheme:dark;--bg:#08090c;--panel:rgba(17,18,23,.88);--panel2:#14151b;--line:rgba(255,255,255,.09);--muted:#a3a5ae;--text:#f4f4f6;--red:#d93636;--red2:#ff5555;--red-soft:rgba(217,54,54,.14)}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{min-height:100svh;overflow-x:hidden;overflow-y:auto;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.backdrop{position:fixed;inset:0;z-index:-4;background:#090a0e url("data:image/gif;base64,") center/cover no-repeat;opacity:.18;filter:grayscale(.7) brightness(.45);transform:none;animation:none}
.shade{position:fixed;inset:0;z-index:-3;background:radial-gradient(ellipse at 50% 36%,rgba(130,24,30,.18),transparent 48%),linear-gradient(180deg,rgba(7,8,11,.84),rgba(7,8,11,.96))}
.vignette{position:fixed;inset:0;z-index:-2;box-shadow:inset 0 0 160px 30px #000;pointer-events:none}
.grain{display:none}
#embers{opacity:.24}
.ember{box-shadow:0 0 8px 2px #d93636}
.topbar{position:relative;z-index:5;width:min(1120px,calc(100% - 48px));margin:0 auto;padding:28px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font:600 10px/1.4 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:2.2px;color:#c7c8ce}
.brandmark{display:flex;align-items:center;gap:12px;color:#f2f2f4}
.branddot{display:inline-block;width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--red2);box-shadow:0 0 0 4px var(--red-soft)}
.status{display:flex;align-items:center;gap:11px;color:#b8c0bd}
.status .branddot{background:#65c995;box-shadow:0 0 0 4px rgba(101,201,149,.12)}
main{position:relative;z-index:3;min-height:calc(100svh - 150px);width:100%;display:grid;place-items:center;padding:64px 24px 76px}
.content{position:relative;width:min(100%,680px);padding:clamp(34px,6vw,66px) clamp(22px,6vw,64px);text-align:center;background:linear-gradient(145deg,rgba(23,24,31,.94),rgba(12,13,18,.94));border:1px solid rgba(255,255,255,.105);border-radius:22px;box-shadow:0 28px 90px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(18px);animation:arrive .75s cubic-bezier(.2,.8,.2,1) both}
.content:before{content:"";position:absolute;top:-1px;left:18%;right:18%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,85,85,.8),transparent)}
@keyframes arrive{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 22px;color:#c2a1a1;font:600 10px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:3px;text-transform:uppercase}
.eyebrow:before,.eyebrow:after{content:"";width:26px;height:1px;background:rgba(217,54,54,.65)}
h1{margin:0;color:#f5f3f4;font:800 clamp(46px,10vw,82px)/.98 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:clamp(3px,1vw,9px);text-shadow:0 0 34px rgba(217,54,54,.17)}
.rule{width:54px;height:3px;margin:25px auto 22px;border-radius:3px;background:var(--red);box-shadow:0 0 18px rgba(217,54,54,.45)}
.tagline{margin:0 0 34px;color:#c3c4cb;font:500 13px/1.6 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.4px}
.prompt{margin:0 0 22px;color:var(--muted);font:400 14px/1.6 Inter,ui-sans-serif,system-ui,sans-serif}
.actions{width:min(100%,360px);margin:0 auto;display:grid;gap:12px}
button{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:54px;padding:15px 20px;border:1px solid rgba(255,91,91,.48);border-radius:10px;background:linear-gradient(135deg,#a92c32,#7c2028);color:#fff;font:700 11px/1.3 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.8px;text-transform:uppercase;cursor:pointer;overflow:hidden;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,background .2s ease}
button:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.13) 50%,transparent 75%);transform:translateX(-130%);transition:transform .6s ease}
button:hover{transform:translateY(-2px);border-color:rgba(255,120,120,.8);box-shadow:0 10px 28px rgba(135,25,35,.25);background:linear-gradient(135deg,#bd343c,#8e252e)}
button:hover:before{transform:translateX(130%)}
button:active{transform:translateY(0) scale(.99)}
button:focus-visible{outline:2px solid #fff;outline-offset:4px}
.secondary{background:rgba(255,255,255,.035);border-color:var(--line);color:#d5d5da}
.secondary:hover{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.2);box-shadow:none}
.hidden{display:none!important}
.screen{animation:screenIn .35s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.site-list{width:min(100%,420px);gap:11px}
.site-list button{justify-content:space-between;min-height:64px;padding:18px 20px;text-align:left;border-color:var(--line);background:rgba(255,255,255,.035);font-size:11px;letter-spacing:1.6px}
.site-list button:hover{background:var(--red-soft);border-color:rgba(255,85,85,.48)}
.arrow{color:#ff8888;font-size:18px}
.site-list .arrow{font-size:20px}
.site-list .maintenance{cursor:not-allowed;opacity:.68;background:rgba(255,255,255,.025);border-color:var(--line);color:#aaa}
.site-list .maintenance:before{display:none}
.status-tag{font:600 9px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1px;color:#dba3a3;border:1px solid #70464a;padding:7px 9px}
.bottom{position:relative;z-index:5;width:min(1120px,calc(100% - 48px));margin:0 auto;padding:18px 0 24px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);font:600 9px/1.4 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.8px;color:#777b85}
.bottom span:last-child{color:#b78b8d}
@media(max-width:600px){.topbar{width:calc(100% - 36px);padding:21px 0;font-size:9px;letter-spacing:1.4px}.topbar .right-note{display:none}main{min-height:calc(100svh - 128px);padding:44px 18px 54px}.content{padding:38px 22px;border-radius:17px}.eyebrow{font-size:9px;letter-spacing:2px;margin-bottom:19px}.tagline{font-size:11px;letter-spacing:1px;margin-bottom:28px}.prompt{font-size:13px}.site-list button{min-height:60px;padding:16px 17px}.bottom{width:calc(100% - 36px);padding:15px 0 20px;font-size:8px;letter-spacing:1.1px}}
@media(max-height:650px){main{padding-top:28px;padding-bottom:32px}.content{padding-top:30px;padding-bottom:30px}.eyebrow{margin-bottom:12px}h1{font-size:clamp(42px,9vh,70px)}.rule{margin:17px auto}.tagline{margin-bottom:20px}button{min-height:48px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="backdrop"></div><div class="shade"></div><div class="vignette"></div>
<div id="embers" aria-hidden="true"></div><div class="grain"></div>
<header class="topbar">
 <div class="brandmark"><i class="branddot"></i><span>FORSAKEN EXPERIENCE</span></div>
 <div class="right-note">ENTER THE INFERNO</div>
 <div class="status"><i class="branddot"></i><span>PORTAL ONLINE</span></div>
</header>
<main>
 <div class="content">
  <div class="eyebrow">Official access portal</div>
  <h1>FORSAKEN</h1>
  <div class="rule"></div>
  <div class="tagline">One identity. Multiple destinations.</div>
  <section id="welcome" class="screen">
   <p class="prompt">Welcome back. Select continue to access the Forsaken network.</p>
   <div class="actions"><button id="continueBtn">Continue <span class="arrow">→</span></button></div>
  </section>
  <section id="sites" class="hidden">
   <p class="prompt">Choose the service you want to access.</p>
   <div class="actions site-list">
    <button data-url="https://app.beamse.pro/gen/Forsaken"><span>Main Dashboard</span><span class="arrow">↗</span></button>
    <button data-url="https://app.beamers.si/u/Forsakenbeamzz"><span>Beamers Portal</span><span class="arrow">↗</span></button>
    <button data-url="https://www.logged.tg/auth/forsakenbeamzz"><span>Logged Portal</span><span class="arrow">↗</span></button>
    <button id="backBtn" class="secondary"><span>← Back</span></button>
   </div>
  </section>
 </div>
</main>
<footer class="bottom"><span>© FORSAKEN</span><span>✦ THE RED INFERNO ✦</span></footer>
<script>
const welcome=document.getElementById('welcome'),sites=document.getElementById('sites');
document.getElementById('continueBtn').addEventListener('click',()=>{welcome.classList.add('hidden');sites.classList.remove('hidden');sites.classList.add('screen')});
document.getElementById('backBtn').addEventListener('click',()=>{sites.classList.add('hidden');welcome.classList.remove('hidden')});
document.querySelectorAll('[data-url]').forEach(b=>b.addEventListener('click',()=>window.open(b.dataset.url,'_blank','noopener,noreferrer')));
const holder=document.getElementById('embers');
for(let i=0;i<48;i++){const e=document.createElement('i');e.className='ember';const s=2+Math.random()*4;e.style.left=Math.random()*100+'%';e.style.width=s+'px';e.style.height=s+'px';e.style.animationDuration=5+Math.random()*10+'s';e.style.animationDelay=-Math.random()*14+'s';e.style.setProperty('--drift',(Math.random()*150-75)+'px');holder.appendChild(e)}
</script>
</body>
</html>
